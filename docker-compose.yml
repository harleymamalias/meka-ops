services:
  postgres:
    image: postgres:16-alpine
    container_name: meka-ops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-meka_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-meka_password}
      POSTGRES_DB: ${DB_NAME:-meka_ops_db}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${DB_USERNAME:-meka_user} -d ${DB_NAME:-meka_ops_db}',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
    driver: local
